# Builds and smoke-tests a standalone bundle on each OS (PyInstaller cannot
# cross-compile), then uploads the zips as workflow artifacts.
name: bundles

on:
  push:
  workflow_dispatch:

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libfontconfig1 libdbus-1-3
      - run: uv sync
      - run: uv run pytest
        env:
          QT_QPA_PLATFORM: offscreen
      - run: uv run python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: image-to-vector-${{ runner.os }}
          path: dist/*.zip
