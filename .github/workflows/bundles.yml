# Builds and smoke-tests a standalone bundle on each OS (PyInstaller cannot
# cross-compile), then uploads the zips as workflow artifacts.
name: bundles

on:
  push:
  workflow_dispatch:

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libfontconfig1 libdbus-1-3
      - run: uv sync
      - run: uv run pytest
        env:
          QT_QPA_PLATFORM: offscreen
      - run: uv run python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: image-to-vector-${{ runner.os }}
          path: dist/*.zip

  release:
    # Pushing a tag like v0.1.0 publishes the three smoke-tested bundles as a
    # GitHub release; it only runs if every bundle job passed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: |
            Standalone builds of Image to Vector; no Python install needed. Unzip and run.

            - **macOS, Apple Silicon only** (`darwin-arm64`): open `Image to Vector.app`. It is not signed with a Developer ID or notarized, so macOS may say it is damaged or can't be opened. Right-click → Open, or run `xattr -dr com.apple.quarantine "Image to Vector.app"` once.
            - **Windows, x64** (`windows-amd64`): run `Image to Vector.exe` inside the unzipped folder. It is unsigned, so SmartScreen may warn: More info → Run anyway.
            - **Linux, x86_64** (`linux-x86_64`): run `./Image to Vector` inside the unzipped folder. Minimal installs also need the `libxcb-cursor0` package.

            Each bundle was built on GitHub's runners and passed a headless smoke test: a command-line export with QR-code overlay, and GUI start-up. The macOS bundle has also been used on a desktop. The Windows and Linux bundles have not been tried on a desktop yet.
        run: |
          gh release create "$GITHUB_REF_NAME" bundles/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Image to Vector $GITHUB_REF_NAME" \
            --notes "$NOTES"
